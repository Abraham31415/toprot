services:
  - type: web
    name: toprot-document-service
    runtime: python
    region: frankfurt
    plan: free
    rootDir: service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
